# Sends the LeyBatt Pulse morning email at about 5:15 am IST, after the 4 am data update.
# Needs three repository secrets: GMAIL_USER, GMAIL_APP_PASSWORD, MAIL_TO (comma-separated).
# To send now: Actions tab → "LeyBatt Pulse daily email" → Run workflow.
# To send a test to one person only, type their address in "Send only to" before clicking Run workflow.
name: LeyBatt Pulse daily email
on:
  schedule:
    - cron: "45 23 * * *"   # 23:45 UTC = 05:15 IST
  workflow_dispatch:
    inputs:
      only_to:
        description: "Send only to (optional test address; leave empty to send to everyone)"
        required: false
        default: ""
      check_only:
        description: "Only count the recipients in MAIL_TO; do not send"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Send digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ONLY_TO: ${{ inputs.only_to }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          if [ -n "$ONLY_TO" ]; then echo "::add-mask::$ONLY_TO"; fi
          python3 scripts/send_digest.py
