# Sends the LeyBatt Pulse morning email once a day.
# Main trigger: straight after the morning data update has been scored by the risk navigator (about 4:15 am IST),
# but only once that day's update (data/meta.json "updated" = today in IST) has landed.
# Backups: GitHub's schedule at 05:15 and 07:30 IST, which often start hours late or not at all,
# send whatever data is there if nothing has gone out yet that day.
# A marker on the email-log branch records the IST date of the last full send, so the mail never goes out twice.
# Needs three repository secrets: GMAIL_USER, GMAIL_APP_PASSWORD, MAIL_TO (comma-separated).
# To send now: Actions tab → "LeyBatt Pulse daily email" → Run workflow (tick "Send again" if today's already went).
# To send a test to one person only, type their address in "Send only to" before clicking Run workflow.
name: LeyBatt Pulse daily email
on:
  workflow_run:
    workflows: ["LeyBatt Pulse risk navigator"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "45 23 * * *"   # 23:45 UTC = 05:15 IST (backup)
    - cron: "0 2 * * *"     # 02:00 UTC = 07:30 IST (second backup)
  workflow_dispatch:
    inputs:
      only_to:
        description: "Send only to (optional test address; leave empty to send to everyone)"
        required: false
        default: ""
      check_only:
        description: "Only count the recipients in MAIL_TO; do not send"
        type: boolean
        required: false
        default: false
      force:
        description: "Send again even if today's email has already gone out"
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: daily-digest
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Decide whether to send
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          ONLY_TO: ${{ inputs.only_to }}
          CHECK_ONLY: ${{ inputs.check_only }}
          FORCE: ${{ inputs.force }}
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          last=""
          if git fetch -q origin email-log 2>/dev/null; then last=$(git show FETCH_HEAD:last_sent.txt 2>/dev/null | tr -d '[:space:]'); fi
          updated=$(python3 -c "import json;print(json.load(open('data/meta.json')).get('updated',''))")
          echo "today=$today" >> "$GITHUB_OUTPUT"
          echo "IST today $today, last full send '$last', data updated $updated, event $EVENT"
          send=yes
          if [ -n "$ONLY_TO" ] || [ "$CHECK_ONLY" = "true" ]; then send=yes      # tests never count as the day's send
          elif [ "$FORCE" = "true" ]; then send=yes
          elif [ "$last" = "$today" ]; then send=no; echo "::notice::Today's email already went out; skipping."
          elif [ "$EVENT" = "workflow_run" ] && [ "$updated" != "$today" ]; then send=no; echo "::notice::Today's data update has not landed yet; skipping."
          fi
          echo "send=$send" >> "$GITHUB_OUTPUT"
      - name: Send digest
        if: steps.gate.outputs.send == 'yes'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ONLY_TO: ${{ inputs.only_to }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          if [ -n "$ONLY_TO" ]; then echo "::add-mask::$ONLY_TO"; fi
          python3 scripts/send_digest.py
      - name: Record today's send
        if: steps.gate.outputs.send == 'yes' && inputs.only_to == '' && inputs.check_only != true
        env:
          TODAY: ${{ steps.gate.outputs.today }}
        run: |
          d=$(mktemp -d); cd "$d"
          git init -q && git checkout -q -b email-log
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$TODAY" > last_sent.txt
          git add last_sent.txt && git commit -q -m "Email sent $TODAY"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" email-log
