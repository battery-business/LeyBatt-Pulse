# LeyBatt Pulse: lithium carbonate futures during the trading day.
# Some company networks block Sina Finance in the browser, so GitHub fetches the price instead
# every 15 minutes while the Guangzhou market is open (09:00-11:30 and 13:30-15:00 Beijing,
# i.e. 06:30-09:00 and 11:00-12:30 IST, Monday to Friday) and the website shows it.
name: LeyBatt Pulse live lithium
on:
  schedule:
    - cron: "*/15 1-3 * * 1-5"   # 01:00-03:45 UTC = 06:30-09:15 IST
    - cron: "*/15 5-7 * * 1-5"   # 05:00-07:45 UTC = 10:30-13:15 IST
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: live-lithium
  cancel-in-progress: true
jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the latest price
        run: python3 scripts/live_lithium.py
      - name: Save and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "Live lithium $(TZ=Asia/Kolkata date +'%-d %b %H:%M') IST"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then break; fi
            sleep 5
          done
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || echo "Pages rebuild request not accepted; the next push will publish it."
