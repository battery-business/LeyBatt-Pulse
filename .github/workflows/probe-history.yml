name: Probe history sources (test only)
# One-off, run by hand: checks which free sources can give ~5 years of price history.
# Reads only. Writes no data files, commits nothing and sends no email.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Try each source
        run: python scripts/probe_history.py
